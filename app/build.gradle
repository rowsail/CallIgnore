plugins {
    id "com.android.application"
}

// Optional release signing for your own builds. F-Droid builds unsigned and signs with its own key.
// keystore.properties (git-ignored): storeFile=…, storePassword=…, keyAlias=…, keyPassword=…
def keystoreProps = new Properties()
def keystoreFile = rootProject.file("keystore.properties")
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace "io.github.rowsail.callignore"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.rowsail.callignore"
        minSdk 29
        targetSdk 36
        versionCode 4
        versionName "1.3"
    }

    signingConfigs {
        if (keystoreProps["storeFile"]) {
            release {
                storeFile rootProject.file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreProps["storeFile"]) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Reproducible output: no build-time dependency metadata blob in the APK.
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
