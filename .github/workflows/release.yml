# Build, test, sign and publish the APK.
#  - Pushing a tag vX.Y builds it and publishes a GitHub pre-release with the APK.
#  - "Run workflow" (manual) is a dry run: same build and signing, APK kept as a
#    workflow artifact, nothing published.
# Signing secrets: KEYSTORE_BASE64 (base64 of the .keystore), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Read app version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' app/build.gradle)
          code=$(sed -n 's/^ *versionCode \([0-9][0-9]*\)$/\1/p' app/build.gradle)
          changelog=fastlane/metadata/android/en-US/changelogs/$code.txt
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName \"$name\" in app/build.gradle"
            exit 1
          fi
          if [ ! -f "$changelog" ]; then
            echo "::error::Missing $changelog for versionCode $code"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "changelog=$changelog" >> "$GITHUB_OUTPUT"

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are not set (see the top of this workflow)"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Test and build
        run: ./gradlew --no-daemon test assembleRelease

      - name: Collect APK
        id: apk
        run: |
          apk=CallIgnore-${{ steps.version.outputs.name }}.apk
          # app-release.apk only exists when signing worked (otherwise it's app-release-unsigned.apk).
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          bt=$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          cert=$("$bt/apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p')
          echo "file=$apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "$apk.sha256")" >> "$GITHUB_OUTPUT"
          echo "cert=$cert" >> "$GITHUB_OUTPUT"
          echo "Built $apk  sha256=$(cut -d' ' -f1 "$apk.sha256")  cert=$cert" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep APK (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: CallIgnore-*.apk*

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          APK: ${{ steps.apk.outputs.file }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
          CERT: ${{ steps.apk.outputs.cert }}
          CHANGELOG: ${{ steps.version.outputs.changelog }}
        run: |
          {
            echo '> [!WARNING]'
            echo '> **Beta: not ready for everyday use.** The call-handling paths have not yet been fully tested with real incoming calls.'
            echo "> **Testers are very welcome.** Please [open an issue](https://github.com/$GITHUB_REPOSITORY/issues) with your phone model, Android version, carrier, and \`adb logcat -s CallIgnore\` output if you can."
            echo
            echo "## What's new in $NAME"
            cat "$CHANGELOG"
            echo
            echo '## Install'
            echo "1. Download \`$APK\` below and open it on your phone (Android 10 or later)."
            echo '2. Open **Call Ignore** and tap **Make Call Ignore the call-screening app**.'
            echo '3. For `answer` rules, also tap **Allow "answer & hang up"**.'
            echo
            echo "Updates install over earlier releases from this page; your rules are kept. See the [manual](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/MANUAL.md)."
            echo
            echo '## Verify the download'
            echo '| | |'
            echo '|---|---|'
            echo "| SHA-256 | \`$SHA256\` |"
            echo "| Signing certificate SHA-256 | \`$CERT\` |"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
            --title "Call Ignore $NAME (beta)" --notes-file notes.md "$APK" "$APK.sha256"

      - name: Remove signing material
        if: always()
        run: rm -f release.keystore keystore.properties
